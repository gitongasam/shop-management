spring:
  application:
    name: shop-management

  datasource:
    url: jdbc:postgresql://localhost:5432/shop_management
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/shop_management
    user: postgres
    password: password
    locations: classpath:db/migration

  profiles:
    active: docker

server:
  port: 8080
